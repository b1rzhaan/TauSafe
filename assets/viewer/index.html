<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TauSafe · От города к вершинам</title>
<style>
*{box-sizing:border-box}html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#e3edf4;color:#142e41}canvas{display:block;touch-action:none}
button{cursor:pointer;border:1px solid #fff;background:#fffffff2;color:#245a79;border-radius:12px;padding:10px 13px;font-weight:600;box-shadow:0 3px 12px #193a2310;min-height:40px}button:focus-visible{outline:3px solid #df9d31;outline-offset:2px}button:hover{background:#d7e9f4}
.tools{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:6px;z-index:4;flex-wrap:wrap}.tools #home{margin-left:auto}.secondary{top:60px}.secondary button{font-size:11px;min-height:34px;padding:8px 11px;background:#ffffffbf}#resort{background:#245a79;color:white;border-color:#245a79}
.pin{position:absolute;left:0;top:0;padding:7px 10px;min-height:32px;font-size:11px;white-space:nowrap;border:1px solid #fff;z-index:2;pointer-events:auto;visibility:hidden}.pin.selected{background:#245a79;color:white}.pin.detail{background:#fff7e5;color:#624722;font-size:10px;border-color:#f1d5a4}.pin.city{background:#f4eee0;color:#596748;letter-spacing:2px;font-size:13px;border-bottom:3px solid #bd9e67}
.pin.safety-pin{background:#e8f2f1;color:#234a53;font-size:10px;border-color:#bad9d9}
.legend{position:absolute;bottom:8px;left:12px;right:12px;pointer-events:none;font-size:9px;line-height:1.6;color:#476056;z-index:3}.legend span{background:#edf4f8f0;border-radius:4px;padding:2px 5px}#route-status{color:#7e591f;font-weight:bold}.failure{padding:40px 24px;line-height:1.8}
#detail-card{position:absolute;z-index:5;right:14px;bottom:94px;width:280px;max-width:calc(100% - 28px);padding:17px;background:#fffffff5;border:1px solid white;border-radius:16px;box-shadow:0 12px 36px #193a2326}#detail-card[hidden]{display:none}#detail-card h3{font-size:15px;margin:7px 30px 9px 0}#detail-card p{font-size:12px;line-height:1.55;margin:0;color:#59695f}#detail-card small{font-size:9px;letter-spacing:1.3px;color:#927440}#close-detail{position:absolute;top:7px;right:7px;min-height:32px;padding:5px 10px;background:none;border:0;box-shadow:none;font-size:20px}
#spot-list{position:absolute;left:12px;right:12px;bottom:46px;display:flex;gap:5px;overflow-x:auto;z-index:4;scrollbar-width:thin;padding:3px 0}#spot-list:empty{display:none}#spot-list button{font-size:10px;flex-shrink:0;min-height:34px;padding:8px 10px;background:#fff7e8;border-color:#e8d5b1;box-shadow:none}
@media(max-width:480px){.tools{left:8px;right:8px;gap:4px}.tools button{font-size:11px;padding:9px 10px}.secondary button{font-size:10px;padding:7px 8px}.pin{font-size:10px;max-width:185px;overflow:hidden;text-overflow:ellipsis}#detail-card{bottom:92px;width:250px}.legend{font-size:8px;left:8px;right:8px}}
.drone-pin{position:absolute;left:0;top:0;z-index:3;background:#173d57;color:#c1f4ff;border:1px solid #7bd8ed;padding:4px 7px;min-height:22px;border-radius:5px;font-size:9px;letter-spacing:1px;visibility:hidden}
button{border-radius:9px} .pin.selected{box-shadow:0 3px 10px #173d5726}
</style></head><body>
<div id="scene" aria-label="Интерактивная 3D-диорама Алматы и гор"></div>
<nav class="tools" aria-label="Места на карте"><button id="city">Алматы</button><button id="resort">Курорт ↗</button><button id="home">↗ Вся карта</button></nav>
<div class="tools secondary"><button id="view">Сверху</button><button id="fly">▷ Облёт</button><button id="motion" aria-pressed="true">Ⅱ Анимация</button><button id="north" aria-label="Ориентировать на север">N ↑</button></div>
<aside id="detail-card" hidden aria-live="polite"><button id="close-detail" aria-label="Закрыть описание">×</button><small>РАССМОТРЕТЬ БЛИЖЕ</small><h3 id="detail-title"></h3><p id="detail-text"></p></aside>
<div id="spot-list" aria-label="Объекты выбранного места"></div>
<div class="legend"><span id="route-status">ДЕМО-ТРЕК · НЕ ДЛЯ НАВИГАЦИИ</span> <span>Движение условное · объекты увеличены</span><br><span>Рельеф ×1,65 · Mapzen / AWS · © OpenStreetMap contributors · ODbL</span></div>
<script src="viewer.js?v=alpine-6"></script></body></html>
